spring.application.name=smart-complaint-management-system

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_complaint_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

JWT_SECRET=${JWT_SECRET:local-development-secret-key-change-this-123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}